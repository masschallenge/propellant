name: Preview site

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Netlify preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check for the Netlify secrets
        id: secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Skipped the preview: add the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets to turn it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - if: steps.secrets.outputs.ready == 'true'
        run: yarn install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        run: yarn build
      - name: Deploy the preview
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes netlify-cli@27.15.0 deploy \
            --dir dist \
            --no-build \
            --alias "pr-$PR_NUMBER" \
            --message "Pull request $PR_NUMBER at ${HEAD_SHA:0:7}" \
            --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"
      - name: Post the preview link on the pull request
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          marker='<!-- netlify-preview -->'
          body="$marker
          **Preview:** $PREVIEW_URL

          Built from ${HEAD_SHA:0:7}. It updates on every push to this pull request."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body"
          fi
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
